<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Lesson</title>
  <style>
    /* Keeping styling simple and readable on purpose — this is a learning
       tool, not a marketing site. Plain, calm, easy to read on a work
       laptop without looking flashy. */
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }
    .hook {
      color: #666;
      font-style: italic;
      margin-bottom: 30px;
    }
    #interactive-area {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 20px;
      margin: 20px 0;
      background: #fafafa;
    }
    button {
      background: #2d6a4f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #245a41; }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    button:disabled:hover { background: #2d6a4f; }
    textarea {
      width: 100%;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 14px;
      padding: 10px;
      box-sizing: border-box;
    }
    #mark-covered {
      margin-top: 30px;
    }
    #lesson-nav {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      font-size: 14px;
    }
    #lesson-nav ul {
      padding-left: 20px;
      margin: 8px 0 0;
    }
    #lesson-nav li {
      margin-bottom: 4px;
    }
    #toggle-buttons button {
      margin-right: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- These get filled in by loadLesson() below -->
  <h1 id="lesson-title">Loading...</h1>
  <p class="hook" id="lesson-hook"></p>
  <div id="lesson-body"></div>

  <div id="interactive-area">
    <p id="interactive-placeholder">Interactive content loads here.</p>
  </div>

  <button id="mark-covered">Mark as covered</button>

  <div id="lesson-nav"></div>

  <script>
    /*
     * This is the whole "engine" of the site. It does four things:
     *   1. Reads lessons/manifest.json to find which lessons exist, and
     *      figures out which one to show (a ?lesson= URL param, or the
     *      most recently added one by default)
     *   2. Renders a plain "all lessons" list so every lesson is
     *      actually reachable, not just whichever one loads by default
     *   3. Fetches that lesson's content and shows it
     *   4. If the lesson is a "code" type, loads Pyodide so the visitor
     *      can actually run and edit Python right on this page; if it's
     *      "concept", loads that lesson's interactive.json and renders
     *      a toggle-compare or step-slider widget from it
     *
     * Every lesson lives in /lessons/YYYY-MM-DD-topic-name/lesson.md
     * The top of that file (between the --- lines) is "frontmatter" —
     * simple key: value metadata that tells this page how to render it.
     */

    // Set by init() before loadLesson() ever runs.
    let LESSON_FOLDER;

    // Turns a folder name like "2026-08-27-cloud-providers" into a plain
    // label like "Cloud Providers" for the nav list — pure string work,
    // so building the list doesn't need an extra fetch per lesson just
    // to find its title.
    function folderToLabel(folder) {
      const slug = folder.replace(/^\d{4}-\d{2}-\d{2}-/, "");
      return slug.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    }

    function renderNav(manifest) {
      const nav = document.getElementById("lesson-nav");
      if (!manifest.length) return;
      const items = manifest.map(entry => {
        const label = folderToLabel(entry.folder);
        const check = isCovered(entry.folder) ? "✓ " : "";
        return entry.folder === LESSON_FOLDER
          ? `<li>${check}<strong>${label}</strong> (current)</li>`
          : `<li>${check}<a href="?lesson=${entry.folder}">${label}</a></li>`;
      }).join("");
      nav.innerHTML = `<strong>All lessons:</strong><ul>${items}</ul>`;
    }

    // "Covered" here is Eric's own personal record of which lessons he's
    // actually been through, kept in this browser's localStorage - not
    // the same thing as tracker.json's status, which is the curator's
    // record of what's been built/is ready to teach. Doing this with a
    // client-side GitHub write token instead would mean anyone visiting
    // this public site could extract that token and push to the repo,
    // so localStorage (per-device, no credentials) is the right call
    // for what's really a personal "I've seen this" checkbox.
    const COVERED_STORAGE_KEY = "coveredLessons";

    function getCoveredLessons() {
      try {
        return JSON.parse(localStorage.getItem(COVERED_STORAGE_KEY) || "[]");
      } catch (err) {
        // Private browsing, disabled storage, etc. - just behave as if
        // nothing's been marked yet instead of breaking the page.
        return [];
      }
    }

    function isCovered(folder) {
      return getCoveredLessons().includes(folder);
    }

    function markCovered(folder) {
      const covered = getCoveredLessons();
      if (!covered.includes(folder)) {
        covered.push(folder);
        try {
          localStorage.setItem(COVERED_STORAGE_KEY, JSON.stringify(covered));
        } catch (err) {
          // Same as above - fail quietly rather than breaking the page.
        }
      }
    }

    function setupMarkCoveredButton(manifest) {
      const btn = document.getElementById("mark-covered");
      function refreshButton() {
        if (isCovered(LESSON_FOLDER)) {
          btn.innerText = "✓ Covered";
          btn.disabled = true;
        } else {
          btn.innerText = "Mark as covered";
          btn.disabled = false;
        }
      }
      btn.onclick = () => {
        markCovered(LESSON_FOLDER);
        refreshButton();
        renderNav(manifest); // so the checkmark shows up in the list too
      };
      refreshButton();
    }

    async function init() {
      // manifest.json is just a flat list of lesson folders, in the
      // order they were added — this is what makes "show me every
      // lesson" and "show me the latest one" possible without the
      // browser being able to list a directory (static hosting can't).
      const manifestResponse = await fetch("lessons/manifest.json");
      const manifest = manifestResponse.ok ? await manifestResponse.json() : [];
      const knownFolders = manifest.map(entry => entry.folder);

      const requestedFolder = new URLSearchParams(window.location.search).get("lesson");
      LESSON_FOLDER = (requestedFolder && knownFolders.includes(requestedFolder))
        ? requestedFolder
        : knownFolders[knownFolders.length - 1];

      renderNav(manifest);
      setupMarkCoveredButton(manifest);
      loadLesson();
    }

    async function loadLesson() {
      try {
        await loadLessonUnsafe();
      } catch (err) {
        // Without this, a failed fetch (wrong path, 404, network hiccup)
        // leaves the page stuck on "Loading..." forever with no clue why.
        // Surfacing the actual error makes that failure diagnosable
        // instead of silent.
        document.getElementById("lesson-title").innerText = "Couldn't load this lesson";
        document.getElementById("lesson-hook").innerText = "";
        document.getElementById("lesson-body").innerHTML =
          `<p>${err.message}</p><p>Expected to find: lessons/${LESSON_FOLDER}/lesson.md</p>`;
      }
    }

    async function loadLessonUnsafe() {
      // Fetch the raw markdown file for this lesson
      const response = await fetch(`lessons/${LESSON_FOLDER}/lesson.md`);
      if (!response.ok) {
        throw new Error(`Fetch failed: HTTP ${response.status} ${response.statusText}`);
      }
      const rawText = await response.text();

      // Split out the frontmatter (the metadata between the --- lines)
      // from the actual lesson content below it.
      const parts = rawText.split("---");
      const frontmatterText = parts[1];
      const bodyText = parts.slice(2).join("---");

      // Turn the frontmatter text into a simple key/value object.
      // Example line: "type: concept" becomes { type: "concept" }
      const metadata = {};
      frontmatterText.trim().split("\n").forEach(line => {
        const [key, ...rest] = line.split(":");
        metadata[key.trim()] = rest.join(":").trim().replace(/^"|"$/g, "");
      });

      // Fill in the title and hook line at the top of the page
      document.getElementById("lesson-title").innerText = metadata.title;
      document.getElementById("lesson-hook").innerText = metadata.hook;

      // Very basic markdown-to-HTML: headings, paragraphs, simple lists,
      // and **bold**. Still intentionally minimal — a real markdown
      // library can swap in later without changing anything else.
      //
      // The tricky part: markdown paragraphs are usually "soft-wrapped" —
      // one sentence spread across several lines with plain newlines, and
      // a *blank* line is what actually marks a new paragraph. Splitting
      // on every newline (the old approach) turned each wrapped line into
      // its own paragraph, which is why lessons rendered as choppy
      // one-line fragments. Fixing that means grouping by blank-line-
      // separated blocks first, so wrapped lines get joined back into one
      // paragraph — except list-item lines ("1. ", "- "), which should
      // each stay on their own line within that block.
      // For a code-type lesson, a fenced ```code block``` in the markdown
      // is the starter snippet meant to load into the editable box below
      // — pull it out here (and drop it from the rendered prose, so it
      // isn't shown twice) before the paragraph pass runs.
      const codeFenceMatch = bodyText.match(/```[a-zA-Z]*\n([\s\S]*?)```/);
      const starterCode = codeFenceMatch ? codeFenceMatch[1].replace(/\n$/, "") : null;
      const proseText = codeFenceMatch ? bodyText.replace(codeFenceMatch[0], "") : bodyText;

      const applyInline = text => text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      const bodyHtml = proseText
        .split(/\n\s*\n/)
        .map(block => {
          const trimmed = block.trim();
          if (trimmed === "" || trimmed.includes("interactive.js renders here")) {
            return "";
          }
          if (trimmed.startsWith("## ")) {
            return `<h2>${applyInline(trimmed.slice(3))}</h2>`;
          }
          const pieces = [];
          let current = "";
          trimmed.split("\n").forEach(line => {
            const text = line.trim();
            const isListItem = /^(\d+\.|[-*])\s/.test(text);
            if (isListItem) {
              if (current) pieces.push(current);
              current = text;
            } else {
              current = current ? `${current} ${text}` : text;
            }
          });
          if (current) pieces.push(current);
          return pieces.map(p => `<p>${applyInline(p)}</p>`).join("\n");
        })
        .join("\n");
      document.getElementById("lesson-body").innerHTML = bodyHtml;

      // Step 3: based on the lesson's "type", decide what goes in the
      // interactive area. This is the "modular" part — adding a third
      // type later just means adding another branch here.
      if (metadata.type === "code") {
        loadCodeInteractive(starterCode);
      } else if (metadata.type === "concept") {
        loadConceptInteractive();
      }
    }

    // Concept-day interactivity. Every concept lesson's folder can have
    // its own interactive.json describing a widget in one of two shapes
    // (a two-option "toggle" comparison, or a "steps" slider through a
    // sequence) — this reads that data and renders the matching widget,
    // so no per-lesson JavaScript is ever needed, just data.
    async function loadConceptInteractive() {
      const area = document.getElementById("interactive-area");
      try {
        const response = await fetch(`lessons/${LESSON_FOLDER}/interactive.json`);
        if (!response.ok) {
          throw new Error(`no interactive.json for this lesson (HTTP ${response.status})`);
        }
        const data = await response.json();
        if (data.type === "toggle") {
          renderToggleWidget(area, data);
        } else if (data.type === "steps") {
          renderStepsWidget(area, data);
        } else {
          throw new Error(`unknown interactive type: ${data.type}`);
        }
      } catch (err) {
        // This lesson doesn't have interactive.json yet (or it's
        // malformed) - fall back to a plain placeholder instead of
        // leaving the interactive area broken or empty.
        area.innerHTML = `<p id="interactive-placeholder">Interactive content coming soon for this lesson.</p>`;
      }
    }

    // Renders a two-option comparison: click a label, see that option's
    // content. Used for anything shaped like "pick A or B and see how
    // the reasoning differs."
    function renderToggleWidget(area, data) {
      area.innerHTML = `
        <p>${data.prompt || ""}</p>
        <div id="toggle-buttons"></div>
        <p id="toggle-content"></p>
      `;
      const buttonsEl = document.getElementById("toggle-buttons");
      const contentEl = document.getElementById("toggle-content");

      function show(index) {
        contentEl.innerText = data.options[index].content;
        Array.from(buttonsEl.children).forEach((btn, i) => {
          btn.style.opacity = i === index ? "1" : "0.6";
        });
      }

      data.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.innerText = option.label;
        btn.onclick = () => show(index);
        buttonsEl.appendChild(btn);
      });

      show(0); // show the first option by default
    }

    // Renders a slider that steps through a sequence, showing each
    // step's label and content as you drag. Used for anything shaped
    // like "watch this progress through stages."
    function renderStepsWidget(area, data) {
      area.innerHTML = `
        <p>${data.prompt || ""}</p>
        <input type="range" id="steps-slider" min="0" max="${data.steps.length - 1}" value="0" style="width: 100%;">
        <p id="steps-label" style="font-weight: bold; margin-top: 12px; margin-bottom: 4px;"></p>
        <p id="steps-content"></p>
      `;
      const slider = document.getElementById("steps-slider");
      const labelEl = document.getElementById("steps-label");
      const contentEl = document.getElementById("steps-content");

      function show(index) {
        labelEl.innerText = data.steps[index].label;
        contentEl.innerText = data.steps[index].content;
      }

      slider.oninput = () => show(Number(slider.value));
      show(0); // show the first step by default
    }

    // Escapes text being inserted between HTML tags (as opposed to into
    // an attribute) - needed because the starter code is dropped
    // straight into a <textarea>...</textarea> as raw markup, so an
    // unescaped "<" or "&" in someone's Python (comparisons, "a && b"
    // typos, etc.) would otherwise corrupt the box's contents.
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // For code-type lessons: load Pyodide from the CDN (not stored in
    // this repo — see the earlier discussion on why) and give the
    // visitor an editable code box that actually runs. starterCode
    // comes from the lesson's own fenced code block (see loadLessonUnsafe)
    // so each code lesson opens with its own snippet, not a generic one.
    async function loadCodeInteractive(starterCode) {
      const area = document.getElementById("interactive-area");
      const initialCode = starterCode || 'print("edit me and run!")';
      area.innerHTML = `
        <textarea id="code-box" rows="10">${escapeHtml(initialCode)}</textarea>
        <br><br>
        <button id="run-code">Run</button>
        <pre id="code-output"></pre>
      `;

      // Load the Pyodide script from the CDN, pinned to a specific
      // version so it never silently changes on us.
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/pyodide/v0.28.0/full/pyodide.js";
      document.head.appendChild(script);

      script.onload = async () => {
        const pyodide = await loadPyodide();
        document.getElementById("run-code").onclick = async () => {
          const code = document.getElementById("code-box").value;
          try {
            const result = await pyodide.runPythonAsync(code);
            document.getElementById("code-output").innerText = result;
          } catch (err) {
            document.getElementById("code-output").innerText = "Error: " + err;
          }
        };
      };
    }

    // Kick everything off once the page loads
    init();
  </script>

</body>
</html>
